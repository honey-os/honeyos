services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeyos-backend-dev
    restart: unless-stopped
    ports:
      - "7778:7778"
      # Dev uses high ports to avoid conflicts with host services
      - "2222:2222"   # SSH honeypot
      - "8080:8080"   # HTTP honeypot
      - "2323:2323"   # Telnet honeypot
      - "2121:2121"   # FTP honeypot
      - "3307:3307"   # MySQL honeypot
    volumes:
      - ./backend:/app
      - ./data:/data
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=sqlite:////data/honeyos.db
    command: ["python", "app.py"]
    networks:
      - honeyos-net-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: honeyos-frontend-dev
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:7778
    depends_on:
      - backend
    networks:
      - honeyos-net-dev

networks:
  honeyos-net-dev:
    driver: bridge
