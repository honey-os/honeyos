version: 2

# Versions are pinned exactly and Dependabot moves the pins, so every move is
# a pull request that CI has checked. Minor and patch bumps are grouped per
# ecosystem; majors arrive one at a time because they are the ones to read.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-all:
        patterns:
          - "*"

  # The node and python base images.
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /backend
    schedule:
      interval: weekly
      day: monday
