version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Only minor/patch bumps are batched into one PR. Major bumps are left
      # out of the group so Dependabot opens them as individual PRs — one
      # breaking major (e.g. Next 14→16, Tailwind 3→4) can't poison the batch.
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
