name: CI

# The gate for pull requests, and the stage docker-build.yml reuses through
# workflow_call, so the same checks run on a PR and before an image build.
# Do not rename the `build-and-test` job: a required status check matches the
# job name, and a rename silently stops it reporting.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint and type-check frontend
        working-directory: ./frontend
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test frontend
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # 3.13 is the Python the published image runs: its runtime stage is
      # node:26-slim (Debian 13), which ships python3 3.13. Keep the three in
      # step: this, backend/Dockerfile, and the Debian release under the image.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite://
        run: python -m pytest tests/ -v

  # Proves the image itself still builds on a pull request, base images
  # included. Skipped when docker-build.yml calls this workflow, because that
  # workflow builds the real image straight afterwards.
  image-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=honeyos-pr
          cache-to: type=gha,scope=honeyos-pr,mode=max
