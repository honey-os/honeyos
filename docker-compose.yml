services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeyos-backend
    restart: unless-stopped
    ports:
      - "7778:7778"
      # Honeypot ports - map standard ports to internal high ports
      # Attackers scanning the network see real service ports
      - "22:2222"     # SSH honeypot
      - "80:8080"     # HTTP honeypot
      - "23:2323"     # Telnet honeypot
      - "21:2121"     # FTP honeypot
      - "3306:3307"   # MySQL honeypot
    volumes:
      - honeyos-data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/honeyos.db
    networks:
      - honeyos-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7778/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeyos-frontend
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:7778
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - honeyos-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7777/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  honeyos-data:
    driver: local

networks:
  honeyos-net:
    driver: bridge
